<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Songs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #0f2027);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            width: 350px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #00d2ff;
        }
        .track-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 20px;
            margin: 0 0 5px 0;
            font-weight: 600;
        }
        p {
            color: #b0bec5;
            font-size: 14px;
            margin: 0;
        }
        audio {
            width: 100%;
            outline: none;
        }
        footer {
            margin-top: 20px;
            color: #b0bec5;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>Vortex Songs</h1>
        
        <div class="track-info">
            <p>Now Playing</p>
            <h2>The Poultry Heist</h2>
        </div>

        <audio controls src="song.mp3">
            Your browser does not support the audio element.
        </audio>
    </div>

    <footer>
        &copy; 2026 Vortex Songs. All rights reserved.
    </footer>

</body>
</html>
